/* Park City Estate Management: the gate */
:root{
  --spruce:#0F2E29; --pine:#0A211D; --snow:#F1F4F2; --lamp:#E9B46A; --mist:#9DB0AA;
  --serif:"Libre Caslon Display","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Tenor Sans","Gill Sans","Helvetica Neue",Arial,sans-serif;
}
html.g-lock,html.g-lock body{overflow:hidden;height:100%}
body{margin:0;background:var(--pine)}
#site[hidden]{display:none!important}
#site{position:relative}
#site main:focus{outline:none}

#gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,3.2vh,32px);padding:20px;color:var(--snow);font-family:var(--sans);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
#gate *{box-sizing:border-box}
#gate ::selection{background:#E9B46A;color:#0F2E29}
#gate.g-restoring{visibility:hidden}

.g-wall{position:absolute;inset:0;z-index:0;
  background:radial-gradient(68% 56% at 50% 40%,#133a34 0%,#0d2c27 46%,#0A211D 82%),#0A211D}
.g-wall::before{content:"";position:absolute;left:50%;top:calc(50% + var(--dh,400px)*.05);width:min(120vw,calc(var(--dh,400px)*1.5));height:calc(var(--dh,400px)*.5);transform:translateX(-50%);background:radial-gradient(ellipse at 50% 20%,rgba(233,180,106,.2),rgba(233,180,106,.06) 45%,transparent 70%);filter:blur(6px)}
.g-wall::after{content:"";position:absolute;inset:0;opacity:.09;mix-blend-mode:screen;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27220%27%20height%3D%27220%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%201%200%200%200%200%201%200%200%200%200%201%201.2%200%200%200%20-.2%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E")}

/* the doorway: the mark, drawn large, with real doors */
.g-doorway{--dh:clamp(270px,min(54vh,calc(100svh - 318px)),540px);
  position:relative;z-index:1;width:calc(var(--dh)*.675);height:var(--dh);
  border:2px solid rgba(241,244,242,.86);border-bottom:0;border-radius:999px 999px 0 0;
  overflow:hidden;perspective:calc(var(--dh)*2.6);transform-origin:50% 62.5%;background:#0A211D;box-shadow:inset 0 0 0 1px rgba(0,0,0,.5),inset 0 18px 30px rgba(0,0,0,.55)}
.g-doorway::before{content:"";position:absolute;z-index:4;pointer-events:none;inset:10% 13.9% 0 13.9%;border:1px solid rgba(241,244,242,.55);border-bottom:0;border-radius:999px 999px 0 0;box-shadow:inset 0 0 18px rgba(0,0,0,.55),inset 0 0 0 2px rgba(0,0,0,.28),0 0 0 999px #17403a}
.g-light{position:absolute;inset:0;z-index:1;opacity:0;
  background:radial-gradient(ellipse 70% 52% at 50% 62.5%,#F7D89F 0%,#EBB86C 24%,#D2954F 50%,#9A6030 78%,#4F3320 100%)}
.g-door{position:absolute;top:0;bottom:0;width:50%;z-index:2;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  --brass:linear-gradient(90deg,#6c4818,#dcae62 40%,#f6dca0 52%,#b4792f 76%,#5f3d14)}
.g-l{left:0;transform-origin:0 50%;border-right:1px solid rgba(0,0,0,.55);
  background:
    radial-gradient(60% 45% at 50% 62%,rgba(233,180,106,.16),transparent 70%),
    linear-gradient(90deg,#0b2823 0%,#12382f 55%,#17443a 100%)}
.g-r{right:0;transform-origin:100% 50%;
  background:
    radial-gradient(60% 45% at 50% 62%,rgba(233,180,106,.16),transparent 70%),
    linear-gradient(270deg,#0b2823 0%,#12382f 55%,#17443a 100%)}
/* raised panels */
.g-door::before,.g-door::after{content:"";position:absolute;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(0,0,0,.16));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.1),0 1px 0 rgba(255,255,255,.07),inset 0 0 22px rgba(0,0,0,.4)}
.g-l::before,.g-l::after{left:37%;right:13%}
.g-r::before,.g-r::after{left:13%;right:37%}
.g-door::before{top:19%;height:31%;border:0}
.g-door::after{top:55%;bottom:7%;border:0}
.g-l::before{border-top-left-radius:999px}
.g-r::before{border-top-right-radius:999px}
/* brass pulls and hinge straps, drawn in the door background */
.g-l,.g-r{--pw:calc(var(--dh)*.013)}
.g-pull{position:absolute;top:52%;width:var(--pw);height:calc(var(--dh)*.17);border-radius:99px;background:var(--brass);
  box-shadow:0 2px 6px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.25)}
.g-l .g-pull{right:9%}
.g-r .g-pull{left:9%}
.g-door::selection{background:none}
.g-seam{position:absolute;z-index:2;left:50%;top:14%;bottom:0;width:1px;margin-left:-.5px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(233,180,106,0),rgba(233,180,106,.55) 55%,rgba(233,180,106,.22))}
.g-lamp{--d:calc(var(--dh)*.05);position:absolute;z-index:3;left:50%;top:62.5%;width:var(--d);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2);
  border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF1CC,#F3C77E 55%,#D9953F);
  box-shadow:0 0 0 calc(var(--dh)*.007) #b98536,0 0 0 calc(var(--dh)*.011) rgba(0,0,0,.45),0 0 calc(var(--dh)*.06) calc(var(--dh)*.014) rgba(243,199,126,.62);
  animation:g-breathe 5.5s ease-in-out infinite}
.g-lamp::before{content:"";position:absolute;left:50%;top:50%;width:calc(var(--dh)*.52);height:calc(var(--dh)*.52);
  margin:calc(var(--dh)*-.26) 0 0 calc(var(--dh)*-.26);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(233,180,106,.32) 0%,rgba(233,180,106,.11) 38%,rgba(233,180,106,0) 68%)}
@keyframes g-breathe{0%,100%{opacity:.82}50%{opacity:1}}
/* the lamp answers the typing: --fill runs 0 to 1 as the code is entered, and a little past 1 when it is accepted */
.g-lamp{filter:brightness(calc(1 + var(--fill,0)*.16));transition:filter .35s ease}
.g-lamp::before{opacity:calc(.55 + var(--fill,0)*.45);transform:scale(calc(1 + var(--fill,0)*.32));transition:opacity .35s ease,transform .45s cubic-bezier(.3,.1,.2,1)}

/* the form */
.g-ui{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;width:min(100%,400px);text-align:center}
.g-word{width:min(246px,62vw);color:var(--snow);margin-bottom:clamp(16px,2.8vh,28px)}
.g-word svg{width:100%;height:auto}
.g-ui label{font-size:.9rem;color:var(--mist);margin-bottom:.35rem}
.g-field{position:relative;display:flex;align-items:center;width:100%;border-bottom:1px solid rgba(241,244,242,.4);transition:border-color .3s,box-shadow .3s}
.g-field:focus-within{border-bottom-color:var(--lamp);box-shadow:0 1px 0 0 var(--lamp)}
.g-field input{flex:1;min-width:0;background:transparent;border:0;outline:0;border-radius:0;color:var(--snow);font:inherit;font-size:clamp(.95rem,4.8vw,1.15rem);
  letter-spacing:.14em;text-align:center;text-transform:uppercase;padding:.6rem 3.5rem .6rem calc(3.5rem + .14em);caret-color:var(--lamp)}
.g-field input::placeholder{color:rgba(241,244,242,.24);letter-spacing:.14em}
.g-field button{position:absolute;right:0;top:0;bottom:0;flex:none;font:inherit;font-size:.98rem;letter-spacing:.015em;color:var(--lamp);background:transparent;border:0;
  padding:.6rem 0 .6rem 1rem;cursor:pointer}
.g-field button:hover{color:#F7D296}
.g-field button[disabled]{opacity:.55;cursor:default}
.g-field button:focus-visible{outline:2px solid var(--lamp);outline-offset:3px;border-radius:2px}
.g-msg{min-height:3.1em;margin:.85rem 0 0;max-width:23rem;font-size:.92rem;line-height:1.5;color:#F2C98C}
/* while the code is checked, a thin light travels along the line; when it is right, the line fills and the code glows */
.g-field::after{content:"";position:absolute;left:0;bottom:-1px;width:100%;height:1px;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(233,180,106,0) 0,#F2C98C 50%,rgba(233,180,106,0) 100%);background-size:42% 100%;background-repeat:no-repeat;background-position:-42% 0}
.g-ui[aria-busy=true] .g-field::after{opacity:1;animation:g-scan 1s ease-in-out infinite}
@keyframes g-scan{to{background-position:142% 0}}
.g-field.ok{border-bottom-color:transparent}
.g-field.ok::after{opacity:1;height:2px;background-size:100% 100%;background-position:0 0;box-shadow:0 0 14px 1px rgba(233,180,106,.55);
  transform-origin:0 50%;animation:g-fill .65s cubic-bezier(.3,.1,.2,1) both}
@keyframes g-fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.g-field.ok input{color:#F7D296;text-shadow:0 0 16px rgba(233,180,106,.55);transition:color .5s ease,text-shadow .5s ease}
.g-field.ok button{opacity:0;transition:opacity .3s ease}
.g-field.shake{animation:g-shake .44s}
@keyframes g-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}

/* opening. Times run from the moment the code is accepted; gate.js uses the same numbers for its timers.
   0.0-0.6 form fades | 0.1-1.4 lamp swells | 0.45-3.2 doors swing, light spills on the floor | 1.2-5.6 the chalet warms
   2.5-5.2 the opening widens to the whole screen | 4.6 the home page begins to settle | 5.0-5.9 gate fades | 6.3 gate removed */
.g-spill{position:absolute;z-index:0;left:var(--dcx,50%);top:calc(var(--dbot,60%) - var(--dw,330px)*.5);width:calc(var(--dw,330px)*3);height:calc(var(--dw,330px)*1.4);
  margin-left:calc(var(--dw,330px)*-1.5);pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(255,229,184,.38) 0%,rgba(238,190,118,.17) 32%,rgba(233,180,106,.06) 64%,rgba(233,180,106,0) 100%)}
.g-scene{position:absolute;inset:0;z-index:1;overflow:hidden;background:#0A211D;pointer-events:none;
  clip-path:inset(calc(var(--it) + 1.5px) calc(var(--ir) + 1.5px) var(--ib) calc(var(--il) + 1.5px) round calc(var(--rad) - 1.5px) calc(var(--rad) - 1.5px) 0 0);
  animation:g-aperture 2.7s cubic-bezier(.6,0,.25,1) 2.5s both}
/* the logo's inner arch, carried outward: a thin light edge that rides the opening as it widens, then thins away */
.g-rim{position:absolute;inset:0;z-index:1;pointer-events:none;background:rgba(241,244,242,.85);opacity:0;
  clip-path:inset(var(--it) var(--ir) var(--ib) var(--il) round var(--rad) var(--rad) 0 0);
  animation:g-aperture 2.7s cubic-bezier(.6,0,.25,1) 2.5s both,g-rimfade 2.7s linear 2.5s both}
.g-art{position:absolute;overflow:hidden}
.g-dolly{position:absolute;inset:0;transform-origin:50% 50%;animation:g-dolly 8.2s linear 0s both}
.g-dolly svg{display:block;width:100%;height:100%}
.g-bloom{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0;
  background:radial-gradient(circle,rgba(255,214,150,.62) 0%,rgba(243,176,92,.24) 36%,rgba(233,180,106,0) 70%);
  animation:g-bloom 4.4s ease 1.2s both}
.g-snow{position:absolute;inset:0;pointer-events:none;animation:g-snowout 1s ease 4.2s forwards}
.g-flake{position:absolute;top:0;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:#F1F4F2;opacity:var(--o);
  animation:g-flake var(--d) linear var(--w) infinite}
@keyframes g-aperture{to{clip-path:inset(var(--et) var(--eh) -2px var(--eh) round var(--er) var(--er) 0 0)}}
@keyframes g-rimfade{0%{opacity:0}6%{opacity:.85}65%{opacity:.4}100%{opacity:0}}
@keyframes g-dolly{
  0%,30.5%{transform:translate(var(--tx),var(--ty)) scale(var(--s0,1.08));animation-timing-function:cubic-bezier(.6,0,.25,1)}
  56.1%{transform:translate(0,0) scale(var(--s0,1.08));animation-timing-function:cubic-bezier(.16,.7,.2,1)}
  100%{transform:translate(0,0) scale(1)}}
@keyframes g-bloom{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1)}65%{opacity:.8}100%{opacity:0;transform:scale(1.15)}}
@keyframes g-flake{from{transform:translate3d(0,-4vh,0)}to{transform:translate3d(var(--dx),106vh,0)}}
@keyframes g-snowout{to{opacity:0}}
@keyframes g-spill{0%{opacity:0;transform:scale(.45,.3)}100%{opacity:1;transform:scale(1,1)}}
#gate.open{pointer-events:none;animation:g-out .9s ease 5s forwards}
@keyframes g-out{to{opacity:0}}
#gate.open .g-ui{opacity:0;transform:translateY(10px);transition:opacity .6s ease,transform .6s ease}
#gate.open .g-doorway{background:transparent;animation:g-frame .6s ease-in 2.5s forwards}
@keyframes g-frame{to{opacity:0}}
#gate.open .g-light{display:none}
#gate.open .g-spill{animation:g-spill 2.8s cubic-bezier(.3,.1,.2,1) .45s both}
#gate.open .g-l{transform:rotateY(104deg);filter:brightness(.5);transition:transform 2.7s cubic-bezier(.45,0,.2,1) .45s,filter 2.7s cubic-bezier(.45,0,.2,1) .45s}
#gate.open .g-r{transform:rotateY(-104deg);filter:brightness(.5);transition:transform 2.7s cubic-bezier(.45,0,.2,1) .55s,filter 2.7s cubic-bezier(.45,0,.2,1) .55s}
#gate.open .g-seam{opacity:0;transition:opacity .4s ease .45s}
#gate.open .g-lamp{animation:g-lamp 1.3s ease .1s forwards}
@keyframes g-lamp{0%{transform:scale(1);opacity:1}40%{transform:scale(1.5);opacity:1}100%{transform:scale(2.4);opacity:0}}

@supports not (clip-path:inset(0 round 1px)){.g-scene,.g-rim{display:none!important}}

@media (prefers-reduced-motion:reduce){
  .g-scene,.g-rim,.g-spill{display:none!important}
  .g-lamp{animation:none}
  .g-field.shake{animation:none}
  .g-ui[aria-busy=true] .g-field::after,.g-field.ok::after{animation:none!important}
  .g-lamp,.g-lamp::before{transition:none}
  #gate.open{animation:g-fade .6s ease forwards}
  #gate.open .g-ui,#gate.open .g-doorway,#gate.open .g-doorway::before,#gate.open .g-l,#gate.open .g-r,#gate.open .g-seam,
  #gate.open .g-light,#gate.open .g-lamp,#gate.open .g-wall{animation:none!important;transition:none!important}
  @keyframes g-fade{to{opacity:0}}
}

<script>
(function () {
  'use strict';
  var CFG = JSON.parse(document.getElementById('cfg').textContent);
  var root = document.documentElement;
  var gate = document.getElementById('gate');
  var form = document.getElementById('gForm');
  var field = document.getElementById('gField');
  var input = document.getElementById('gCode');
  var btn = document.getElementById('gBtn');
  var msg = document.getElementById('gMsg');
  var site = document.getElementById('site');
  var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  var MAIL = 'hello@parkcityestatemanagement.com';
  var KEY = 'pcem-code';

  var enc = new TextEncoder();
  var dec = new TextDecoder();

  function b64(s) {
    var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  function hex(u) {
    var o = '';
    for (var i = 0; i < u.length; i++) o += ('0' + u[i].toString(16)).slice(-2);
    return o;
  }
  function cat(a, b) {
    var o = new Uint8Array(a.length + b.length);
    o.set(a);
    o.set(b, a.length);
    return o;
  }
  function norm(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

  function sha(u) { return crypto.subtle.digest('SHA-256', u).then(function (d) { return new Uint8Array(d); }); }

  // The code never leaves the page. It is stretched with PBKDF2, the result picks a slot,
  // and the slot holds the content key, which opens the site.
  function openWith(code) {
    var dk, slot;
    return crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits'])
      .then(function (km) {
        return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(CFG.salt), iterations: CFG.iter }, km, 256);
      })
      .then(function (bits) {
        dk = new Uint8Array(bits);
        return sha(cat(dk, new Uint8Array([1])));
      })
      .then(function (t) {
        var tag = hex(t.slice(0, 8));
        for (var i = 0; i < CFG.slots.length; i++) if (CFG.slots[i].t === tag) slot = CFG.slots[i];
        if (!slot) return null;
        return sha(cat(dk, new Uint8Array([2])))
          .then(function (wk) { return crypto.subtle.importKey('raw', wk, 'AES-GCM', false, ['decrypt']); })
          .then(function (wk) {
            var w = b64(slot.w);
            return crypto.subtle.decrypt({ name: 'AES-GCM', iv: w.slice(0, 12) }, wk, w.slice(12));
          })
          .then(function (K) { return crypto.subtle.importKey('raw', K, 'AES-GCM', false, ['decrypt']); })
          .then(function (ck) {
            var p = b64(CFG.p);
            return crypto.subtle.decrypt({ name: 'AES-GCM', iv: p.slice(0, 12) }, ck, p.slice(12));
          })
          .then(function (pt) { return JSON.parse(dec.decode(pt)); });
      })
      .catch(function () { return null; });
  }

  function focusSite() {
    var m = document.getElementById('main');
    if (m && m.focus) { try { m.focus({ preventScroll: true }); } catch (e) { m.focus(); } }
  }

  function finish() {
    if (gate && gate.parentNode) gate.parentNode.removeChild(gate);
    root.classList.remove('g-lock');
    window.scrollTo(0, 0);
    focusSite();
  }

  function mount(p, animate) {
    var st = document.createElement('style');
    st.id = 'site-css';
    st.textContent = p.css;
    document.head.appendChild(st);
    if (animate) site.className = 'pre';
    site.innerHTML = p.html;
    site.hidden = false;
    if (p.js) {
      var s = document.createElement('script');
      s.textContent = p.js;
      document.body.appendChild(s);
    }
    if (!animate) { finish(); return; }
    // let the scene paint behind the wall, then open the doors
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        setTimeout(function () {
          if (!reduce) buildScene();
          gate.classList.add('open');
          var t1 = setTimeout(function () { site.classList.remove('pre'); }, reduce ? 0 : 4600);
          var t2 = setTimeout(finish, reduce ? 650 : 6300);
          // any key or tap skips the ceremony
          function skip() {
            clearTimeout(t1); clearTimeout(t2);
            document.removeEventListener('keydown', skip);
            document.removeEventListener('pointerdown', skip);
            site.classList.remove('pre');
            finish();
          }
          document.addEventListener('keydown', skip);
          document.addEventListener('pointerdown', skip);
        }, 140);
      });
    });
  }

  // the valley seen through the doors: a copy of the hero art, framed by the doorway, which then widens to the whole screen
  function el(cls) { var d = document.createElement('div'); d.className = cls; d.setAttribute('aria-hidden', 'true'); return d; }

  function buildScene() {
    try {
      var src = site.querySelector('.hero-art svg');
      var dwEl = gate.querySelector('.g-doorway');
      if (!src || !dwEl) return;
      var vw = window.innerWidth, vh = window.innerHeight;
      // the hero art as it stands (a touch zoomed in). Work out where it will rest, so the copy lands exactly on it.
      var r = src.getBoundingClientRect();
      var s = 1.08;
      try { s = new DOMMatrix(getComputedStyle(src).transform).a || 1.08; } catch (e) {}
      var w0 = r.width / s, h0 = r.height / s;
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      // the lit chalet that is most in view
      var lits = site.querySelectorAll('.hg-lit'), lit = null, best = -1;
      for (var i = 0; i < lits.length; i++) {
        var b = lits[i].getBoundingClientRect();
        var vis = Math.max(0, Math.min(b.right, vw) - Math.max(b.left, 0)) * Math.max(0, Math.min(b.bottom, vh) - Math.max(b.top, 0));
        if (vis > best) { best = vis; lit = lits[i]; }
      }
      if (!lit) return;
      var q = lit.getBoundingClientRect();
      var dw = dwEl.getBoundingClientRect();
      var W = dw.width, H = dw.height;

      var sc = el('g-scene');
      var rim = el('g-rim');
      var art = el('g-art');
      art.style.left = (cx - w0 / 2) + 'px'; art.style.top = (cy - h0 / 2) + 'px';
      art.style.width = w0 + 'px'; art.style.height = h0 + 'px';
      var dolly = el('g-dolly');
      var svg = src.cloneNode(true);
      svg.removeAttribute('role'); svg.removeAttribute('aria-label');
      dolly.appendChild(svg);
      // the warmth that gathers around the lit chalet
      var D = Math.max(q.width, q.height) / s * 2.4;
      var bloom = el('g-bloom');
      bloom.style.width = D + 'px'; bloom.style.height = D + 'px';
      bloom.style.left = (w0 / 2 + (q.left + q.width / 2 - cx) / s - D / 2) + 'px';
      bloom.style.top = (h0 / 2 + (q.top + q.height / 2 - cy) / s - D / 2) + 'px';
      dolly.appendChild(bloom);
      art.appendChild(dolly); sc.appendChild(art);
      // a little snow, thickest in the doorway
      var snow = el('g-snow');
      var x0 = dw.left + 0.139 * W, x1 = dw.right - 0.139 * W;
      for (var k = 0; k < 48; k++) {
        var f = document.createElement('i');
        f.className = 'g-flake';
        var inDoor = k < 22;
        var x = inDoor ? x0 + Math.random() * (x1 - x0) : Math.random() * vw;
        var d = 9 + Math.random() * 7;
        f.style.setProperty('--x', x.toFixed(1) + 'px');
        f.style.setProperty('--s', (1.4 + Math.random() * 2.2).toFixed(1) + 'px');
        f.style.setProperty('--o', (0.22 + Math.random() * 0.45).toFixed(2));
        f.style.setProperty('--d', d.toFixed(1) + 's');
        f.style.setProperty('--w', (-Math.random() * d).toFixed(1) + 's');
        f.style.setProperty('--dx', ((Math.random() - 0.4) * 60).toFixed(0) + 'px');
        snow.appendChild(f);
      }
      sc.appendChild(snow);

      var st = gate.style;
      st.setProperty('--il', (dw.left + 0.139 * W) + 'px');
      st.setProperty('--ir', (vw - (dw.right - 0.139 * W)) + 'px');
      st.setProperty('--it', (dw.top + 0.10 * H) + 'px');
      st.setProperty('--ib', (vh - dw.bottom) + 'px');
      st.setProperty('--rad', (0.361 * W) + 'px');
      // where the opening ends: an arch wider than the screen, so the corners are covered (its cap is always a half circle)
      st.setProperty('--et', (-0.3 * vw) + 'px');
      st.setProperty('--eh', (-0.3 * vw) + 'px');
      st.setProperty('--er', (0.8 * vw) + 'px');
      st.setProperty('--s0', String(s));
      st.setProperty('--tx', ((dw.left + W / 2) - (q.left + q.width / 2)) + 'px');
      st.setProperty('--ty', ((dw.top + 0.6 * H) - (q.top + q.height / 2)) + 'px');
      st.setProperty('--dcx', (dw.left + W / 2) + 'px');
      st.setProperty('--dbot', dw.bottom + 'px');
      st.setProperty('--dw', W + 'px');
      gate.insertBefore(rim, dwEl);
      gate.insertBefore(sc, dwEl);
    } catch (e) { /* the plain doors still open */ }
  }

  var INV = 'invitations@parkcityestatemanagement.com';
  function sayInvite(lead, shake) {
    say(lead + ' To request an invitation, write to ', shake);
    var a = document.createElement('a');
    a.href = 'mailto:' + INV + '?subject=' + encodeURIComponent('Invitation request');
    a.textContent = INV;
    a.style.color = 'inherit';
    a.style.textDecoration = 'underline';
    msg.appendChild(a);
    msg.appendChild(document.createTextNode('.'));
  }

  function say(text, shake) {
    msg.textContent = text;
    input.setAttribute('aria-invalid', 'true');
    if (shake) {
      field.classList.remove('shake');
      void field.offsetWidth;
      field.classList.add('shake');
    }
  }

  // how warm the lamp is: 0 to 1 while a code is typed, a little past 1 when it is accepted
  function setFill(n) { gate.style.setProperty('--fill', String(Math.max(0, n))); }

  function busy(on) {
    btn.disabled = on;
    input.readOnly = on;
    btn.textContent = on ? 'Checking' : 'Enter';
    form.setAttribute('aria-busy', on ? 'true' : 'false');
  }

  if (!(window.crypto && crypto.subtle)) {
    say('This page needs a current browser, opened from a secure address, to unlock. Try Safari, Chrome, Edge, or Firefox, or write to ' + MAIL + '.', false);
    btn.disabled = true;
    input.disabled = true;
    return;
  }

  input.addEventListener('input', function () {
    var v = norm(input.value).slice(0, 10);
    input.value = v.length > 5 ? v.slice(0, 5) + '-' + v.slice(5) : v;
    setFill(v.length / 10);
    if (msg.textContent) { msg.textContent = ''; input.removeAttribute('aria-invalid'); }
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = norm(input.value);
    if (!code) { say('Enter the code from your invitation.', true); return; }
    busy(true);
    var started = Date.now();
    var go = code.length === 10 ? openWith(code) : Promise.resolve(null);
    go.then(function (payload) {
      var wait = Math.max(0, 450 - (Date.now() - started));   // never answer instantly, right or wrong
      setTimeout(function () {
        if (!payload) {
          busy(false);
          setFill(0);
          sayInvite('That code isn’t recognized.', true);
          input.focus();
          input.select();
          return;
        }
        try { sessionStorage.setItem(KEY, code); } catch (err) {}
        // the key turns: the line fills with lamp light, the code glows, the lamp flares, then the doors open
        form.setAttribute('aria-busy', 'false');
        input.readOnly = true;
        msg.textContent = 'Welcome.';
        field.classList.add('ok');
        setFill(1.6);
        setTimeout(function () { mount(payload, true); }, reduce ? 0 : 850);
      }, wait);
    });
  });

  // a reload within the same visit should not ask again
  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (err) {}
  if (saved) {
    gate.classList.add('g-restoring');
    openWith(saved).then(function (payload) {
      if (payload) { mount(payload, false); return; }
      try { sessionStorage.removeItem(KEY); } catch (err) {}
      gate.classList.remove('g-restoring');
    });
  } else if (window.matchMedia && window.matchMedia('(hover: hover)').matches) {
    input.focus();
  }
})();

</script>
</body>
</html>
